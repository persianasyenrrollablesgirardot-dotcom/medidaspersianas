<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Levantamiento tecnico offline para persianas, ensamble e instalacion" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Tecnica Juno" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <title>App Tecnica Campo Juno</title>
  </head>
  <body>
    <div id="root"></div>

    <!--
      PANTALLA DE RESCATE — por qué existe
      ────────────────────────────────────
      Si el programa (el .js con hash en el nombre) no carga, React nunca monta
      y la app queda en NEGRO, sin forma de llegar a Ajustes → "Limpiar Caché".
      Pasa cuando la PWA guardó en su caché un index.html viejo que apunta a un
      archivo que el servidor ya no tiene: como todo se reescribe a index.html,
      el navegador recibe HTML donde esperaba JavaScript y aborta.

      Este bloque es HTML+JS CLÁSICO (no módulo): se ejecuta aunque el bundle
      falle. Convierte la pantalla negra en un botón.

      ⚠ El botón borra SOLO la caché del Service Worker (igual que
      `clearPwaCacheOnly()` en db.ts). NO toca IndexedDB ni localStorage, o sea
      NO borra proyectos ni fotos. Nunca agregar acá nada que borre datos.
    -->
    <div id="rescate" hidden style="display:none;position:fixed;inset:0;z-index:99999;background:#050505;color:#f5f5f5;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;padding:24px;overflow:auto;-webkit-text-size-adjust:100%">
      <div style="max-width:420px;margin:8vh auto 0">
        <h1 style="font-size:20px;line-height:1.3;margin:0 0 12px">La app no terminó de abrir</h1>
        <p style="font-size:15px;line-height:1.5;color:#c9c9c9;margin:0 0 8px">
          Quedó una versión vieja guardada en el teléfono. Se arregla con el botón de abajo.
        </p>
        <p style="font-size:15px;line-height:1.5;color:#7dd3fc;margin:0 0 20px">
          Tus proyectos y fotos NO se tocan: esto solo limpia la copia del programa.
        </p>
        <button id="rescate-btn" style="width:100%;padding:16px;font-size:17px;font-weight:600;border:0;border-radius:12px;background:#38bdf8;color:#04202e">
          Reparar y volver a abrir
        </button>
        <p id="rescate-estado" style="font-size:14px;color:#9ca3af;margin:14px 0 0;min-height:20px"></p>
        <p id="rescate-motivo" style="font-size:11px;color:#4b5563;margin:24px 0 0;word-break:break-all"></p>
      </div>
    </div>

    <script>
      (function () {
        var mostrado = false;

        function arranco() {
          var root = document.getElementById('root');
          return !!root && root.childElementCount > 0;
        }

        function mostrar(motivo) {
          if (mostrado || arranco()) return;
          mostrado = true;
          var caja = document.getElementById('rescate');
          caja.hidden = false;
          caja.style.display = 'block';
          document.getElementById('rescate-motivo').textContent = motivo || '';
        }

        // Un <script type="module"> o un <link> que no cargan disparan 'error'
        // en fase de captura (no burbujean). Damos un margen por si la app
        // igual logra montar con lo que ya tenía en caché.
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
            setTimeout(function () { mostrar('No cargó: ' + (t.src || t.href || '')); }, 2500);
          }
        }, true);

        // Red de seguridad para cualquier otro motivo (excepción al arrancar,
        // chunk dinámico caído, etc.).
        setTimeout(function () { mostrar('El programa no respondió a tiempo.'); }, 9000);

        document.getElementById('rescate-btn').addEventListener('click', async function () {
          var btn = this;
          var estado = document.getElementById('rescate-estado');
          btn.disabled = true;
          btn.style.opacity = '0.6';
          estado.textContent = 'Limpiando la copia vieja...';
          try {
            if ('serviceWorker' in navigator) {
              var regs = await navigator.serviceWorker.getRegistrations();
              for (var i = 0; i < regs.length; i++) await regs[i].unregister();
            }
            // Solo Cache Storage (archivos del programa). IndexedDB intacta.
            if (window.caches) {
              var claves = await caches.keys();
              for (var j = 0; j < claves.length; j++) await caches.delete(claves[j]);
            }
            estado.textContent = 'Listo. Volviendo a abrir...';
          } catch (error) {
            estado.textContent = 'No se pudo limpiar del todo, reintentando abrir igual...';
          }
          // Query nueva = navegación fresca, sin pasar por nada guardado.
          setTimeout(function () {
            location.replace(location.origin + '/?reparado=' + Date.now());
          }, 600);
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
